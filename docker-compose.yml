services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    image: postgres18_ru:latest
    container_name: pinger_db
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    env_file:
      - ./db.env
    environment:
      LANG: ru_RU.UTF-8
      LC_ALL: ru_RU.UTF-8
      LC_CTYPE: ru_RU.UTF-8
    ports:
      - "5433:5432"
    volumes:
      - "./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:latest
    container_name: pinger_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=dev-only-root-token
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root-token
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - "./vault/data:/vault/file"
      - "./vault/policies:/vault/policies:ro"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  pinger:
    build: .
    image: postgres-pinger-vault:0.2.0
    env_file:
      - ./pinger.env
    volumes:
      - ./logs:/var/log
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
