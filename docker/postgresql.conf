# Демонстрационный конфиг PostgreSQL.
# Монтируется в /etc/postgresql/postgresql.conf и подключается через
# `command: postgres -c config_file=/etc/postgresql/postgresql.conf`.
# Локаль БД (ru_RU.UTF-8) задаётся через LANG/LC_ALL/LC_CTYPE в
# docker-compose.yml на этапе инициализации кластера (initdb).

listen_addresses = '*'
port = 5432
max_connections = 100

log_timezone = 'Europe/Moscow'

# Пароль-хэширование: SCRAM-SHA-256 (задаётся на уровне роли/в pg_hba).
password_encryption = 'scram-sha-256'
